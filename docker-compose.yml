version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=docker-incidentiq-demo-key-at-least-32-chars
      - DATABASE_URL=sqlite:////app/data/incidentiq.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-data:
